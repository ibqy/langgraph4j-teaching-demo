server:
  address: 127.0.0.1
  port: 8099
spring:
  application:
    name: langgraph4j-teaching-demo
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-null-for-primitives: true
    mapper:
      allow-coercion-of-scalars: false
teaching:
  model:
    # 默认完全离线。显式设为 openai 才创建真实客户端；不在源码保存密钥。
    provider: ${TEACHING_MODEL_PROVIDER:offline}
    api-key: ${TEACHING_MODEL_API_KEY:}
    base-url: ${TEACHING_MODEL_BASE_URL:}
    model: ${TEACHING_MODEL_NAME:}
